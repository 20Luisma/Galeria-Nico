name: niko_azaretto_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.2+15

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:        # ✅ Necesario para usar GlobalMaterialLocalizations
    sdk: flutter

  # --- PAQUETES DE LA APLICACIÓN ---
  http: ^1.1.0                  # Versión más estable
  image_picker: ^1.0.4          # Versión compatible con iOS
  permission_handler: ^11.0.1   # Versión estable para permisos
  shared_preferences: ^2.2.3
  device_info_plus: ^11.5.0
  audioplayers: ^6.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  image: ^4.1.7
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # --- PLUGIN LOCAL CON NAMESPACE ---
  image_gallery_saver:
    path: plugins/image_gallery_saver-2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ico.png"
  adaptive_icon_background: "#101010"
  adaptive_icon_foreground: "assets/ico.png"
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
